name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Re-scan weekly so newly published vulnerabilities are caught without code changes.
    - cron: "0 6 * * 1"

env:
  IMAGE_NAME: ghcr.io/opentooling/shoutout

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test (90% coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit, component and integration tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/shoutout
      - run: helm lint deploy/helm/shoutout -f deploy/local/values-local.yaml
      - run: helm template ci deploy/helm/shoutout -f deploy/local/values-local.yaml > /dev/null
      - name: OpenShift restricted-v2 mode and extraObjects
        run: |
          values=deploy/helm/shoutout/ci/openshift-values.yaml
          helm lint deploy/helm/shoutout -f "$values"
          rendered="$(helm template ci deploy/helm/shoutout -f "$values")"
          # restricted-v2 assigns UIDs itself and rejects pods that pin them.
          if grep -En 'runAsUser|runAsGroup|fsGroup' <<< "$rendered"; then
            echo "::error::OpenShift mode must not set fixed runAsUser/runAsGroup/fsGroup"; exit 1
          fi
          grep -q 'kind: Route' <<< "$rendered"
          grep -q 'name: ci-shoutout-extra' <<< "$rendered"
          # Conditional extraObjects: rendered when the flag is on, left out otherwise.
          grep -q "name: 'ci-shoutout-when-on'" <<< "$rendered"
          if grep -Eq 'ci-shoutout-when-(off|false)' <<< "$rendered"; then
            echo "::error::extraObjects with a false 'when' must not render"; exit 1
          fi
      - name: Multi-cluster example renders each cluster's objects
        run: |
          render() {
            helm template shoutout deploy/helm/shoutout -f deploy/examples/values-production.yaml \
              -f deploy/examples/multi-cluster/common.yaml -f "deploy/examples/multi-cluster/cluster-$1.yaml" \
              --show-only templates/extra-objects.yaml | grep '^kind:' | sort | tr '\n' ' '
          }
          prod="$(render openshift-prod)"; staging="$(render k8s-staging)"
          echo "prod: $prod"; echo "staging: $staging"
          [ "$prod" = "kind: ExternalSecret kind: PodDisruptionBudget kind: Route " ]
          [ "$staging" = "kind: NetworkPolicy " ]
      - name: Image pull secrets reach every pod
        run: |
          rendered="$(helm template ci deploy/helm/shoutout \
            --set 'imagePullSecrets[0]=regcred' \
            --set imageCredentials.create=true --set imageCredentials.registry=ghcr.io \
            --set imageCredentials.username=ci --set imageCredentials.password=ci)"
          pods=$(grep -cE '^kind: (Deployment|StatefulSet|CronJob|Pod)$' <<< "$rendered")
          # Each pod lists both the global secret and the one the chart created.
          with_regcred=$(grep -c -- '- name: regcred' <<< "$rendered")
          with_created=$(grep -c -- '- name: ci-shoutout-registry' <<< "$rendered")
          echo "pods=$pods regcred=$with_regcred created=$with_created"
          [ "$pods" -gt 0 ] && [ "$with_regcred" -eq "$pods" ] && [ "$with_created" -eq "$pods" ]

  dependency-audit:
    name: Dependency vulnerabilities (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high

  image:
    name: Build and scan container image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # Native Arm runner: no slow QEMU emulation. Matches Apple Silicon k3d clusters.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      # Publish only from main (pull requests and the weekly re-scan just build and scan),
      # and only with credentials that can write to the opentooling org.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (secrets.GHCR_TOKEN != '' || github.repository_owner == 'opentooling') }}
    outputs:
      publish: ${{ env.PUBLISH }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: shoutout:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Trivy vulnerability scan (fails on fixable high/critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shoutout:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Explain skipped publish
        if: env.PUBLISH != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "::notice::Image not published to $IMAGE_NAME. Add a GHCR_TOKEN secret (and GHCR_USERNAME variable) or move the repo to the opentooling org."
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # GITHUB_TOKEN can only publish under this repo's owner. To publish to the
          # opentooling org from elsewhere, set the GHCR_USERNAME variable and a
          # GHCR_TOKEN secret (classic PAT with write:packages, opentooling member).
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Push the scanned image by digest
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Record digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image to GHCR
    if: needs.image.outputs.publish == 'true'
    # Only publish a commit that passed every check.
    needs: [test, helm, dependency-audit, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=sha,format=long,prefix=sha-
            type=raw,value=main
            type=raw,value=latest
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # GITHUB_TOKEN can only publish under this repo's owner. To publish to the
          # opentooling org from elsewhere, set the GHCR_USERNAME variable and a
          # GHCR_TOKEN secret (classic PAT with write:packages, opentooling member).
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Create manifest list (amd64 + arm64)
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)
      - name: Show published image
        run: docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"

  publish-chart:
    name: Publish Helm chart to GHCR
    # Runs after the image exists, so the chart's default image tag always resolves.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHART_REGISTRY: oci://ghcr.io/opentooling/charts
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package chart
        id: package
        run: |
          # Chart version: major.minor from Chart.yaml, patch = CI run number (so a plain
          # `helm install` gets the newest). appVersion = the image tag built from this commit.
          base="$(sed -n 's/^version: *\([0-9]*\.[0-9]*\)\..*/\1/p' deploy/helm/shoutout/Chart.yaml)"
          version="$base.${{ github.run_number }}"
          helm package deploy/helm/shoutout --version "$version" \
            --app-version "sha-$(git rev-parse --short=7 HEAD)" --destination "$RUNNER_TEMP"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Push chart
        run: |
          echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          helm push "$RUNNER_TEMP/shoutout-${{ steps.package.outputs.version }}.tgz" "$CHART_REGISTRY"
        env:
          REGISTRY_USER: ${{ vars.GHCR_USERNAME || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Show published chart
        run: |
          helm show chart "$CHART_REGISTRY/shoutout" --version "${{ steps.package.outputs.version }}"
          echo "::notice::Published $CHART_REGISTRY/shoutout ${{ steps.package.outputs.version }}"
