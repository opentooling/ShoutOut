# -- Public URL of the ShoutOut web app (used for Auth.js callbacks and Keycloak redirects).
appUrl: http://shoutout.localtest.me

nameOverride: ""
fullnameOverride: ""

openshift:
  # -- Run under OpenShift's restricted-v2 SCC. Pods then set no fixed runAsUser,
  # runAsGroup or fsGroup, so OpenShift assigns them from the namespace's UID range.
  # All images used by the chart run as an arbitrary non-root UID. Ingresses still
  # work (OpenShift turns them into Routes); for Route-specific settings, disable the
  # ingresses and add Routes through extraObjects.
  enabled: false

# -- Extra Kubernetes objects to deploy with the release, e.g. custom resources.
# Items can be YAML objects or strings; both are rendered with `tpl`, so template
# expressions like {{ include "shoutout.fullname" $ }} and {{ .Release.Namespace }} work.
# The CRDs for any custom resources must already be installed in the cluster.
extraObjects: []
#  - apiVersion: route.openshift.io/v1
#    kind: Route
#    metadata:
#      name: '{{ include "shoutout.fullname" $ }}-app'
#    spec:
#      host: shoutout.apps.example.com
#      to: { kind: Service, name: '{{ include "shoutout.fullname" $ }}-app' }
#      port: { targetPort: http }
#      tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
#  - |
#    apiVersion: traefik.io/v1alpha1
#    kind: Middleware
#    metadata:
#      name: {{ include "shoutout.fullname" $ }}-headers
#    spec:
#      headers:
#        frameDeny: true

# Shared secrets. Leave empty to auto-generate on install; generated values are
# kept on upgrade. Or point `existingSecret` at a secret with the same keys:
#   auth-secret, keycloak-client-secret, postgres-password, keycloak-admin-password, sync-token
# and, only if your SMTP relay needs a sign-in, smtp-password.
secrets:
  existingSecret: ""
  authSecret: ""
  keycloakClientSecret: ""
  postgresPassword: ""
  keycloakAdminPassword: ""
  syncToken: ""
  # -- Password for notifications.email.smtp.username. Never generated; leave empty for relays without sign-in.
  smtpPassword: ""

# ShoutOut behaviour (passed to the app as environment variables).
config:
  # -- Shoutouts each person can send per calendar quarter; each recipient uses one (SHOUTOUT_QUARTERLY_BUDGET).
  quarterlyBudget: 20
  # -- Maximum recipients in one shoutout (SHOUTOUT_MAX_RECIPIENTS).
  maxRecipients: 5
  # -- Who can open the analytics dashboard: "admins" or "everyone" (SHOUTOUT_ANALYTICS_VISIBILITY).
  # The "not recognised recently" list is always admin-only.
  analyticsVisibility: admins

# Email notifications, sent through your SMTP relay. People get an email when
# someone sends them a shoutout, and a reminder before their unused shoutouts
# expire. Both are on for everyone by default; each person can turn them off on
# their profile page. Most internal relays accept mail from allowed networks
# without a sign-in: ask your mail team to allow the cluster's outgoing IPs and
# the `from` address.
notifications:
  email:
    enabled: false
    # -- Sender address; the relay must accept it (SMTP_FROM).
    from: "ShoutOut <shoutout@example.com>"
    smtp:
      # -- Relay host name (SMTP_HOST). Required when email is enabled.
      host: ""
      # -- Relay port (SMTP_PORT): usually 25 for internal relays, 587 with sign-in, 465 for implicit TLS.
      port: 25
      # -- auto | starttls | tls | none (SMTP_TLS). auto: TLS from the start on port 465,
      # otherwise STARTTLS when the relay offers it. starttls: require STARTTLS.
      # tls: TLS from the start. none: never use TLS (only for relays whose certificate
      # can't be verified; prefer app.extraCaCerts).
      tls: auto
      # -- Only for relays that need a sign-in (SMTP_USER); the password goes in the
      # secret as smtp-password (secrets.smtpPassword).
      username: ""
      # -- Host name for the SMTP greeting (SMTP_EHLO_NAME), for relays that reject the pod's name.
      ehloName: ""
    # -- Seconds to wait before emailing about a new shoutout, so quick edits and deletes are picked up.
    delaySeconds: 120
    # -- Days before the quarterly budget resets to send the reminder (at 08:00 UTC); 0 turns reminders off.
    reminderDaysBeforeReset: 14

# Sync people from Keycloak so everyone can be recognised before they first sign in.
# The Keycloak client's service account needs the realm-management "view-users" role.
userSync:
  enabled: true
  # -- Sync once when the app starts.
  onStartup: true
  # -- CronJob schedule for regular syncs.
  schedule: "0 * * * *"
  # -- Optional regex pattern to filter synced users by username (SHOUTOUT_SYNC_USERNAME_PATTERN).
  # E.g. "^(?!cbk\\.)[a-zA-Z0-9._-]+\\.[a-zA-Z0-9._-]+$"
  usernamePattern: ""
  image:
    repository: docker.io/library/busybox
    tag: "1.37"

app:
  replicaCount: 1
  image:
    repository: ghcr.io/opentooling/shoutout
    tag: ""            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  podAnnotations: {}
  extraEnv: []
  # -- Extra CA certificates to trust, e.g. when Keycloak uses a company CA.
  # Point at a ConfigMap or Secret holding a PEM bundle; sets NODE_EXTRA_CA_CERTS.
  extraCaCerts:
    configMap: ""
    secret: ""
    key: ca.crt
  hostAliases: []
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
  service:
    port: 80
  ingress:
    enabled: true
    className: traefik
    annotations: {}
    host: shoutout.localtest.me
    tls: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Authentication (Keycloak OIDC).
# Everyone who can sign in to the Keycloak client can use ShoutOut; no role or
# directory group is needed. Admins need a client role (below).
auth:
  clientId: shoutout-web
  # -- Issuer URL. Defaults to the bundled Keycloak: <keycloak.url>/realms/<realm>.
  issuer: ""
  # -- Client role that makes someone an admin (SHOUTOUT_ADMIN_ROLE).
  adminRole: admin
  # -- Client that holds the admin role; defaults to auth.clientId (SHOUTOUT_ROLES_CLIENT_ID).
  rolesClientId: ""

# App logs: JSON lines on stdout/stderr.
logging:
  # -- debug | info | warn | error. "debug" also logs Auth.js OIDC traffic (secrets redacted).
  level: info
  # -- json, or text for easier reading with kubectl logs.
  format: json

# Database used by the app.
database:
  name: shoutout
  # -- Used only when postgres.enabled=false: full connection string, or a secret holding it.
  url: ""
  existingSecret: ""
  existingSecretKey: database-url

postgres:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  username: shoutout
  persistence:
    size: 2Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.7.4"
    pullPolicy: IfNotPresent
  # -- Public URL of Keycloak (browser-facing and used as the token issuer).
  url: http://auth.localtest.me
  adminUsername: admin
  database: keycloak
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }
  ingress:
    enabled: true
    className: traefik
    annotations: {}
    host: auth.localtest.me
    tls: []
  realm:
    name: shoutout
    displayName: ShoutOut
    # -- "external" (HTTPS except private networks), "all", or "none" for plain-HTTP local clusters.
    sslRequired: external
    # -- Seed demo users (see files/demo-users.yaml). Never enable in production.
    seedDemoUsers: false
    demoUserPassword: ""
