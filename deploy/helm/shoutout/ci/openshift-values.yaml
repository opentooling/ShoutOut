# CI lint/render check: OpenShift restricted-v2 mode plus extraObjects in both forms.
openshift:
  enabled: true
extraObjects:
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: '{{ include "shoutout.fullname" $ }}-app'
    spec:
      host: shoutout.apps.example.com
      to: { kind: Service, name: '{{ include "shoutout.fullname" $ }}-app' }
      port: { targetPort: http }
      tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: {{ include "shoutout.fullname" $ }}-extra
    data:
      budget: "{{ .Values.config.quarterlyBudget }}"
  # Conditional items: a flag that is on, one that is off, and a plain boolean.
  - when: "{{ .Values.features.flagOn }}"
    object:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: '{{ include "shoutout.fullname" $ }}-when-on'
  - when: "{{ .Values.features.flagOff }}"
    object:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: '{{ include "shoutout.fullname" $ }}-when-off'
  # A flag that isn't defined at all renders empty, so it counts as off.
  - when: "{{ .Values.features.flagMissing }}"
    object:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: '{{ include "shoutout.fullname" $ }}-when-missing'
  # No condition: always rendered.
  - object:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: '{{ include "shoutout.fullname" $ }}-no-when'
  - when: false
    object: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ include "shoutout.fullname" $ }}-when-false
features:
  flagOn: true
  flagOff: false
