{{- if .Values.keycloak.enabled }}
{{- $realm := .Values.keycloak.realm -}}
{{- $appUrl := .Values.appUrl | trimSuffix "/" -}}
{{- /* The client's service account may list users for the ShoutOut people sync. */ -}}
{{- $users := list (dict
      "username" (printf "service-account-%s" .Values.auth.clientId)
      "enabled" true
      "serviceAccountClientId" .Values.auth.clientId
      "clientRoles" (dict "realm-management" (list "view-users"))) -}}
{{- if $realm.seedDemoUsers }}
{{- if not $realm.demoUserPassword }}
{{- fail "keycloak.realm.demoUserPassword is required when seedDemoUsers=true" }}
{{- end }}
{{- range (.Files.Get "files/demo-users.yaml" | fromYamlArray) }}
{{- $clientRoles := dict }}
{{- if .admin }}{{- $clientRoles = dict $.Values.auth.clientId (list $.Values.auth.adminRole) }}{{- end }}
{{- $users = append $users (dict
      "username" .username
      "email" (printf "%s@shoutout.local" .username)
      "firstName" .firstName
      "lastName" .lastName
      "enabled" true
      "emailVerified" true
      "clientRoles" $clientRoles
      "credentials" (list (dict "type" "password" "value" $realm.demoUserPassword "temporary" false))) }}
{{- end }}
{{- end }}
{{- $realmJson := dict
  "realm" $realm.name
  "displayName" $realm.displayName
  "enabled" true
  "sslRequired" $realm.sslRequired
  "registrationAllowed" false
  "loginWithEmailAllowed" true
  "duplicateEmailsAllowed" false
  "resetPasswordAllowed" false
  "bruteForceProtected" true
  "roles" (dict "client" (dict .Values.auth.clientId (list
      (dict "name" .Values.auth.adminRole "description" "ShoutOut admin: cards, values, moderation, exports and analytics")
  )))
  "clients" (list (dict
      "clientId" .Values.auth.clientId
      "name" "ShoutOut"
      "enabled" true
      "protocol" "openid-connect"
      "publicClient" false
      "clientAuthenticatorType" "client-secret"
      "secret" "${SHOUTOUT_CLIENT_SECRET}"
      "standardFlowEnabled" true
      "serviceAccountsEnabled" true
      "directAccessGrantsEnabled" false
      "implicitFlowEnabled" false
      "rootUrl" $appUrl
      "baseUrl" "/"
      "redirectUris" (list (printf "%s/api/auth/callback/keycloak" $appUrl))
      "webOrigins" (list $appUrl)
      "attributes" (dict "post.logout.redirect.uris" (printf "%s/*" $appUrl) "pkce.code.challenge.method" "S256")
      "protocolMappers" (list (dict
          "name" "client roles"
          "protocol" "openid-connect"
          "protocolMapper" "oidc-usermodel-client-role-mapper"
          "config" (dict "multivalued" "true" "usermodel.clientRoleMapping.clientId" .Values.auth.clientId "claim.name" (printf "resource_access.%s.roles" .Values.auth.clientId) "jsonType.label" "String" "id.token.claim" "true" "access.token.claim" "true" "userinfo.token.claim" "true")))
  ))
  "users" $users
-}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shoutout.fullname" . }}-keycloak-realm
  labels:
    {{- include "shoutout.labels" (dict "ctx" $ "component" "keycloak") | nindent 4 }}
data:
  {{ $realm.name }}-realm.json: |
    {{- toPrettyJson $realmJson | nindent 4 }}
{{- end }}
