{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shoutout.secretName" . }}
  labels:
    {{- include "shoutout.labels" (dict "ctx" $ "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  auth-secret: {{ include "shoutout.secretValue" (dict "ctx" $ "key" "auth-secret" "value" .Values.secrets.authSecret) | quote }}
  keycloak-client-secret: {{ include "shoutout.secretValue" (dict "ctx" $ "key" "keycloak-client-secret" "value" .Values.secrets.keycloakClientSecret) | quote }}
  postgres-password: {{ include "shoutout.secretValue" (dict "ctx" $ "key" "postgres-password" "value" .Values.secrets.postgresPassword) | quote }}
  keycloak-admin-password: {{ include "shoutout.secretValue" (dict "ctx" $ "key" "keycloak-admin-password" "value" .Values.secrets.keycloakAdminPassword) | quote }}
  sync-token: {{ include "shoutout.secretValue" (dict "ctx" $ "key" "sync-token" "value" .Values.secrets.syncToken) | quote }}
  {{- with .Values.secrets.smtpPassword }}
  smtp-password: {{ . | quote }}
  {{- end }}
  {{- if and (not .Values.postgres.enabled) .Values.database.url (not .Values.database.existingSecret) }}
  database-url: {{ .Values.database.url | quote }}
  {{- end }}
{{- end }}
