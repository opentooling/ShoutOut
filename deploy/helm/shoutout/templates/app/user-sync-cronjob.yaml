{{- if .Values.userSync.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "shoutout.fullname" . }}-user-sync
  labels:
    {{- include "shoutout.labels" (dict "ctx" $ "component" "user-sync") | nindent 4 }}
spec:
  schedule: {{ .Values.userSync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            {{- include "shoutout.selectorLabels" (dict "ctx" $ "component" "user-sync") | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- include "shoutout.imagePullSecrets" (dict "ctx" $ "extra" .Values.userSync.imagePullSecrets) | nindent 10 }}
          securityContext:
            {{- include "shoutout.podSecurityContext" (dict "ctx" $ "runAsUser" 65534) | nindent 12 }}
          containers:
            - name: sync
              image: "{{ .Values.userSync.image.repository }}:{{ .Values.userSync.image.tag }}"
              imagePullPolicy: {{ .Values.userSync.image.pullPolicy }}
              command:
                - sh
                - -c
                - >-
                  wget -qO- --post-data=''
                  --header "Authorization: Bearer $SYNC_TOKEN"
                  http://{{ include "shoutout.fullname" . }}-app:{{ .Values.app.service.port }}/api/internal/sync-users
              env:
                - name: SYNC_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "shoutout.secretName" . }}
                      key: sync-token
              securityContext:
                {{- include "shoutout.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 16 }}
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { memory: 32Mi }
{{- end }}
