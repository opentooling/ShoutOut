{{- include "shoutout.validateConfig" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shoutout.fullname" . }}-app
  labels:
    {{- include "shoutout.labels" (dict "ctx" $ "component" "app") | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "shoutout.selectorLabels" (dict "ctx" $ "component" "app") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shoutout.selectorLabels" (dict "ctx" $ "component" "app") | nindent 8 }}
      annotations:
        checksum/secrets: {{ include "shoutout.contentChecksum" (dict "ctx" $ "template" "/secrets.yaml") }}
        {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "shoutout.podSecurityContext" (dict "ctx" $) | nindent 8 }}
      initContainers:
        - name: migrate
          image: {{ include "shoutout.app.image" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          # Applies db/migrations/*.sql; retries while the database is still starting.
          command: ["node", "db/migrate.mjs"]
          env:
            {{- include "shoutout.databaseUrlEnv" . | nindent 12 }}
          securityContext:
            {{- include "shoutout.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      containers:
        - name: app
          image: {{ include "shoutout.app.image" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            {{- include "shoutout.databaseUrlEnv" . | nindent 12 }}
            - name: AUTH_URL
              value: {{ .Values.appUrl | trimSuffix "/" | quote }}
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "shoutout.secretName" . }}
                  key: auth-secret
            - name: AUTH_KEYCLOAK_ID
              value: {{ .Values.auth.clientId | quote }}
            - name: AUTH_KEYCLOAK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "shoutout.secretName" . }}
                  key: keycloak-client-secret
            - name: AUTH_KEYCLOAK_ISSUER
              value: {{ include "shoutout.auth.issuer" . | quote }}
            - name: SHOUTOUT_QUARTERLY_BUDGET
              value: {{ .Values.config.quarterlyBudget | int | quote }}
            - name: SHOUTOUT_MAX_RECIPIENTS
              value: {{ .Values.config.maxRecipients | int | quote }}
            - name: SHOUTOUT_ANALYTICS_VISIBILITY
              value: {{ .Values.config.analyticsVisibility | quote }}
            - name: SHOUTOUT_SYNC_ON_STARTUP
              value: {{ and .Values.userSync.enabled .Values.userSync.onStartup | quote }}
            - name: SHOUTOUT_SYNC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "shoutout.secretName" . }}
                  key: sync-token
            - name: SHOUTOUT_ADMIN_ROLE
              value: {{ .Values.auth.adminRole | quote }}
            - name: SHOUTOUT_ROLES_CLIENT_ID
              value: {{ default .Values.auth.clientId .Values.auth.rolesClientId | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            {{- if include "shoutout.extraCaCerts.enabled" . }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/shoutout/ca/{{ .Values.app.extraCaCerts.key }}
            {{- end }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 10
          securityContext:
            {{- include "shoutout.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
            {{- if include "shoutout.extraCaCerts.enabled" . }}
            - name: extra-ca
              mountPath: /etc/shoutout/ca
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- with .Values.app.extraCaCerts }}
        {{- if .configMap }}
        - name: extra-ca
          configMap:
            name: {{ .configMap }}
        {{- else if .secret }}
        - name: extra-ca
          secret:
            secretName: {{ .secret }}
        {{- end }}
        {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
