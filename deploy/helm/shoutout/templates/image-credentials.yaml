{{- with .Values.imageCredentials }}
{{- if .create }}
{{- if not (and .registry .username .password) }}
{{- fail "imageCredentials.create needs registry, username and password" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shoutout.imageCredentialsName" $ }}
  labels:
    {{- include "shoutout.labels" (dict "ctx" $ "component" "registry") | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .registry (dict "username" .username "password" .password "auth" (printf "%s:%s" .username .password | b64enc))) | toJson | b64enc }}
{{- end }}
{{- end }}
